[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-ollama-chatbot"
version = "0.1.0"
description = "A local-first chatbot UI for Ollama"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=0.5",
    "ollama>=0.4",
    "pypdf>=5.0",
    "python-dotenv>=1.0",
    "streamlit>=1.40",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]